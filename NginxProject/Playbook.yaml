---
- name: Nginx
  hosts: linux

  vars_files:
    - vars/logos.yaml
  tasks:
    - name: Install EPEL
      when: ansible_distribution == 'CentOS'
      ansible.builtin.dnf:
        name: epel-release
        update_cache: true
        state: present
    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present
    - name: Restart Nginx
      notify: Check Nginx Http
      ansible.builtin.service:
        name: nginx
        state: restarted
    - name: Unarchive playbook_stacker
      ansible.builtin.unarchive:
        src: files/playbook_stacker.zip
        dest: "{{ nginx_root_location }}"
        mode: '755'
    - name: Template index.html.base.j2 to index.html on target
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ nginx_root_location }}/index.html"
        mode: '644'

  handlers:
    - name: Check Nginx Http
      ansible.builtin.uri:
        url: http://{{ ansible_default_ipv4.address }}/
        status_code: [200]
...
